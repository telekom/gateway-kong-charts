name: Validate

# Validates every pull request, and every push to a release branch.
#
# A push to a release branch that passes validation hands the exact validated commit to
# release.yml, so validation and release share one workflow run and one commit SHA. Pull
# requests never reach the release job, so they can never publish.
#
# Publication of the packaged chart is not part of this workflow: release.yml creates a
# GitHub release, and that event drives publish-oci.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

# Serialise runs per ref, so releases for a given branch never overlap. Superseded pull
# request runs are cancelled; release runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_DOCS_VERSION: "1.14.2"
  KUBERNETES_VERSION: "1.32.4" # Also bump this version in lefthook.yml
  KUBECONFORM_VERSION: "0.8.0"
  KUBE_LINTER_VERSION: "0.8.3"

jobs:
  lint-chart:
    name: Lint and render chart (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default
            values: -f ci/profiles/base.yaml
          - scenario: argo-rollouts
            values: -f ci/profiles/base.yaml -f ci/profiles/argo-rollouts.yaml
          - scenario: keda
            values: -f ci/profiles/base.yaml -f ci/profiles/keda.yaml
          - scenario: hpa-optional-resources
            values: -f ci/profiles/base.yaml -f ci/profiles/hpa-optional-resources.yaml
          - scenario: jumper-management-port
            values: -f ci/profiles/base.yaml -f ci/profiles/jumper-management-port.yaml
          - scenario: otlp
            values: -f ci/profiles/base.yaml -f ci/profiles/otlp.yaml
          - scenario: admin-api-tls-secure
            values: -f ci/profiles/base.yaml -f ci/profiles/admin-api-tls-secure.yaml
          - scenario: admin-api-tls-insecure-zipkin
            values: -f ci/profiles/base.yaml -f ci/profiles/admin-api-tls-insecure-zipkin.yaml
          - scenario: admin-api-tls-insecure-otlp
            values: -f ci/profiles/base.yaml -f ci/profiles/admin-api-tls-insecure-otlp.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5.0.0

      - name: Install kubeconform
        run: |
          set -euo pipefail
          wget -q "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -O - | sudo tar -xzf - -C /usr/local/bin kubeconform

      - name: Install kube-linter
        run: |
          set -euo pipefail
          wget -q "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" -O - | sudo tar -xzf - -C /usr/local/bin kube-linter

      - name: Lint chart
        run: helm lint . ${{ matrix.values }}

      - name: Render chart
        run: helm template . ${{ matrix.values }} > "$RUNNER_TEMP/rendered.yaml"

      - name: Validate Kubernetes schemas
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered.yaml"

      - name: Lint Kubernetes resources
        run: kube-linter lint "$RUNNER_TEMP/rendered.yaml" --fail-if-no-objects-found --format plain

  check-docs:
    name: Check generated README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install helm-docs
        run: |
          set -euo pipefail
          wget -q "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" -O - | tar -xzf - helm-docs
          chmod +x ./helm-docs
          sudo mv ./helm-docs /usr/local/bin/helm-docs

      - name: Regenerate README
        run: helm-docs

      - name: Check README is up to date
        run: |
          if ! git diff --exit-code README.md; then
            printf '\nREADME.md is out of date with the chart values. Run helm-docs locally and commit the result.\n' >&2
            exit 1
          fi

  check-licenses:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: REUSE compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 #v6.0.0

  release:
    # Only a push to a release branch may publish. Pull requests never reach this job, so
    # they never receive write permission and never publish a release.
    name: Release
    needs: [lint-chart, check-docs, check-licenses]
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # release.yml calls publish-oci.yml, and a called workflow can never hold more
      # permission than its caller.
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ github.sha }}
