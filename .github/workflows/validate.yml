name: Validate

# Validates every pull request, and every push to a release branch.
#
# A push to a release branch that passes validation hands the exact validated commit to
# release.yml, so validation and release share one workflow run and one commit SHA. Pull
# requests never reach the release job, so they can never publish.
#
# Publication of the packaged chart is not part of this workflow: release.yml creates a
# GitHub release, and that event drives publish-oci.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

# Serialise runs per ref, so releases for a given branch never overlap. Superseded pull
# request runs are cancelled; release runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_DOCS_VERSION: "1.14.2"

jobs:
  lint-chart:
    name: Lint and render chart (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, argo-rollouts, keda, full]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5.0.0

      - name: Lint chart
        run: helm lint . -f ci/profiles/${{ matrix.profile }}.yaml

      - name: Render chart
        run: helm template . -f ci/profiles/${{ matrix.profile }}.yaml > /dev/null

  check-docs:
    name: Check generated README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install helm-docs
        run: |
          wget -q "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" -O - | tar -xzf - helm-docs
          chmod +x ./helm-docs
          sudo mv ./helm-docs /usr/local/bin/helm-docs

      - name: Regenerate README
        run: helm-docs

      - name: Check README is up to date
        run: |
          if ! git diff --exit-code README.md; then
            printf '\nREADME.md is out of date with the chart values. Run helm-docs locally and commit the result.\n' >&2
            exit 1
          fi

  check-licenses:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: REUSE compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 #v6.0.0

  release:
    # Only a push to a release branch may publish. Pull requests never reach this job, so
    # they never receive write permission and never publish a release.
    name: Release
    needs: [lint-chart, check-docs, check-licenses]
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # release.yml calls publish-oci.yml, and a called workflow can never hold more
      # permission than its caller.
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ github.sha }}
