# Shared CI render baseline. Required for all profiles.
global:
  failOnUnsetValues: false
  database:
    location: local

keyRotation:
  enabled: true

hpaAutoscaling:
  enabled: true

networkPolicy:
  enabled: true

pdb:
  create: true

plugins:
  prometheus:
    podMonitor:
      enabled: true
