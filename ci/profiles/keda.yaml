# Shared CI render baseline. Required for all profiles.
global:
  failOnUnsetValues: false

keyRotation:
  enabled: true

kedaAutoscaling:
  enabled: true
  triggers:
    prometheus:
      # TODO: Remove when KEDA can render without a Prometheus endpoint by default.
      serverAddress: http://prometheus.example
