{{- if .Values.adminApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
  labels: {{ include "app.labels.standard" $ | nindent 4 }}
spec:
  selector: {{ include "app.labels.selectorLabels" $ | nindent 4 }}
  ports:
  - name: {{ include "kong.adminApi.portName" . }}
    port: {{ include "kong.adminApi.port" . }}
    targetPort: {{ include "kong.adminApi.port" . }}
    protocol: TCP
{{- end -}}
